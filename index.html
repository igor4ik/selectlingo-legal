<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SelectLingo — Legal</title>
<meta name="description" content="Legal documents for the SelectLingo Chrome extension: Privacy Policy and Terms of Use.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f9fc;
    --surface: #ffffff;
    --text: #1a2233;
    --muted: #4b5768;
    --accent: #2456c4;
    --accent-hover: #17369b;
    --border: #dde3ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161f;
      --surface: #1a2030;
      --text: #e7ecf5;
      --muted: #aab4c6;
      --accent: #7ea6ff;
      --accent-hover: #a9c3ff;
      --border: #2b3448;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 2rem 1.25rem 0;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 3rem;
  }
  h1 {
    font-size: 1.75rem;
    margin: 0 0 0.25rem;
  }
  .tagline {
    color: var(--muted);
    margin: 0 0 2rem;
    font-size: 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.25rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .card li {
    border-bottom: 1px solid var(--border);
  }
  .card li:last-child {
    border-bottom: none;
  }
  .card a {
    display: block;
    padding: 1rem 0;
    color: var(--accent);
    text-decoration: underline;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .card a:hover,
  .card a:focus-visible {
    color: var(--accent-hover);
  }
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem 1.25rem 2rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<header>
  <main style="padding-bottom: 0;">
    <h1>SelectLingo</h1>
    <p class="tagline">SelectLingo is a Chrome extension for translating and learning language directly on webpages.</p>
  </main>
</header>
<main>
  <p>Legal documents for SelectLingo:</p>
  <nav class="card" aria-label="Legal documents">
    <ul>
      <li><a href="./privacy/">Privacy Policy</a></li>
      <li><a href="./terms/">Terms of Use</a></li>
    </ul>
  </nav>
</main>
<footer>
  <p>SelectLingo</p>
</footer>
</body>
</html>
